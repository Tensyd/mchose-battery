name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    env:
      # The release build uses the GNU toolchain, so CI has to as well: dlltool/as come
      # from the MSYS2 that ships with the runner image, not from rustup.
      CARGO_TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the GNU toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - name: Install mingw binutils
        shell: pwsh
        run: |
          # dlltool is not part of rustup, and the runner image does not ship the
          # mingw-w64 toolchain either — pull it from the MSYS2 that is preinstalled.
          $pacman = 'C:\msys64\usr\bin\pacman.exe'
          if (-not (Test-Path $pacman)) {
            throw 'MSYS2 pacman not found; cannot provide dlltool for the GNU target'
          }
          & $pacman -Sy --noconfirm --needed mingw-w64-x86_64-binutils
          if ($LASTEXITCODE -ne 0) { throw "pacman failed with $LASTEXITCODE" }
          if (-not (Test-Path 'C:\msys64\mingw64\bin\dlltool.exe')) {
            throw 'dlltool still missing after install'
          }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CARGO_TARGET }}

      - name: Formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --target $env:CARGO_TARGET

      - name: Clippy
        run: cargo clippy --target $env:CARGO_TARGET --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --target $env:CARGO_TARGET --release

      - name: Keep the binary for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mc-battery-gnu
          path: target/x86_64-pc-windows-gnu/release/mc-battery.exe
          if-no-files-found: warn
